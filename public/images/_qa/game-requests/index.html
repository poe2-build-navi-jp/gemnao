<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated request QA matrix</title><style>body{font-family:system-ui;background:#dde3e8;margin:20px}nav a{display:inline-block;padding:12px}#matrix{display:flex;gap:20px;align-items:flex-start}iframe{height:1250px;border:1px solid #64717d;flex-shrink:0}h1{font-size:22px}</style></head><body><h1>Isolated request QA — no live requests</h1><nav id="links"></nav><div id="matrix"></div><script>
const p=new URLSearchParams(location.search),locale=p.get('locale')||'ja',mode=p.get('mode')||'available';
for(const l of ['ja','en','zh','es']){const a=document.createElement('a');a.href='?locale='+l+'&mode='+mode;a.textContent=l;document.querySelector('#links').append(a)}
for(const m of ['available','unavailable','duplicate','rate','error','offline','busy','noreceipt']){const a=document.createElement('a');a.href='?locale='+locale+'&mode='+m;a.textContent=m;document.querySelector('#links').append(a)}
for(const width of [375,390,430]){const wrap=document.createElement('section'),h=document.createElement('h2'),frame=document.createElement('iframe');h.textContent=width+'px / '+locale+' / '+mode;frame.src='./fixture.html?locale='+locale+'&mode='+mode;frame.width=String(width);frame.title=h.textContent;wrap.append(h,frame);document.querySelector('#matrix').append(wrap)}
</script></body></html>
