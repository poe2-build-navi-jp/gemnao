name: Community reports analytics preflight
run-name: Community reports read-only capabilities — manual approval
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Schema discovery or read-only usage/cleanup/health inspection; never activation
        type: choice
        required: true
        default: schema
        options: [schema, readiness]
permissions:
  contents: read
jobs:
  gate:
    if: github.repository == 'poe2-build-navi-jp/gemnao' && github.ref == 'refs/heads/gemunao' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.verify.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check read-only boundaries with synthetic credentials
        run: node --test tests/community-reports/preflight.test.mjs tests/community-reports/readiness-inspection.test.mjs
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ops/community-reports/preflight.mjs gate
  discover:
    needs: gate
    if: needs.gate.outputs.environment == 'gemnao-d1-production'
    environment: ${{ needs.gate.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fixed metadata GETs and GraphQL schema/settings only
        if: inputs.mode != 'readiness'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPORTS_PREFLIGHT_ENVIRONMENT: gemnao-d1-production
        run: node ops/community-reports/preflight.mjs discover
      - name: Fixed read-only usage, dedicated DB counts, cleanup schedules and public health; no writes
        if: inputs.mode == 'readiness'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPORTS_PREFLIGHT_ENVIRONMENT: gemnao-d1-production
          REPORTS_READINESS_INSPECTION: 'true'
        run: node ops/community-reports/readiness-inspection.mjs inspect
