name: QA access gate checks (read-only)
on:
  pull_request:
    branches: [prepare/dedicated-worker-qa-20261007, prepare/diagnostic-qa-access-20261009]
    paths:
      - components/diagnostic-feedback-form.tsx
      - lib/diagnostic-feedback/**
      - tests/diagnostic-feedback/**
      - tests/diagnosis/**
      - cloudflare/worker-preview-policy.mjs
      - cloudflare/worker-preview.mjs
      - wrangler.worker-preview.json
      - lib/preview/worker-origin.ts
      - scripts/prepare-worker-preview.mjs
      - scripts/verify-worker-preview-artifact.mjs
      - tests/worker-preview/**
      - package.json
      - pnpm-lock.yaml
      - tests/qa-access/**
      - ops/worker-qa-access/**
      - .github/workflows/worker-qa-access.yml
      - .github/workflows/qa-access-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install fixed dependencies without lifecycle scripts
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.19.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck and lint
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
      - name: Build and verify secret-free preview assets
        env:
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: |
          pnpm build
          node scripts/prepare-worker-preview.mjs
          node scripts/verify-worker-preview-artifact.mjs
          pnpm exec wrangler deploy --config wrangler.worker-preview.json --dry-run --outdir .wrangler/qa-access-dry-run
      - name: Checkout exact reviewed verification dependency after application checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f53724eefe8aa60cc2522e12adbc97f821e6f122
          path: reviewed-controller
          persist-credentials: false
      - name: Gate, existing-ID controller, preview and artifact synthetic tests
        run: node --test tests/qa-access/*.test.mjs tests/worker-preview/*.test.mjs
      - name: Local Workerd authentication smoke test
        run: node tests/qa-access/runtime-smoke.mjs
      - name: Feedback and diagnosis service regressions (local SQLite only)
        run: |
          node tests/diagnostic-feedback/run.mjs
          node scripts/test-diagnosis.mjs tests/diagnosis/rules.test.ts tests/diagnosis/api.test.ts tests/diagnosis/preview-client.test.ts
      - name: Install Chromium for synthetic local browser regressions
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Feedback Basic gate and diagnosis consent browser regressions
        run: |
          node tests/qa-access/feedback-browser.mjs
          node --test tests/diagnosis/share-consent.test.mjs
