name: Community reports public health (read-only)
run-name: Community reports public health — no credentials or writes
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: community-reports-public-health
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'poe2-build-navi-jp/gemnao' && github.ref == 'refs/heads/gemunao'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check public health validation with synthetic HTTP
        run: node --test tests/community-reports/public-health-check.test.mjs
      - name: Read fixed public health once without credentials
        run: node ops/community-reports/public-health-check.mjs
