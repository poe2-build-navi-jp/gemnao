name: QA diagnostics (manual protected)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit diagnostic selection
        required: true
        type: choice
        default: classify-secret-format
        options: [classify-secret-format, read-existing-qa-gate]
  pull_request:
    branches: [prepare/feedback-preview-controller-20261007]
    paths:
      - '.github/workflows/qa-secret-format.yml'
      - 'ops/worker-qa-access/**'
      - 'tests/qa-access/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('qa-secret-format-pr-{0}', github.event.pull_request.number) || 'gemnao-preview-data' }}
  cancel-in-progress: false
jobs:
  synthetic-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f53724eefe8aa60cc2522e12adbc97f821e6f122
          path: reviewed-controller
          persist-credentials: false
      - run: node --test ops/worker-qa-access/secret-format.test.mjs tests/qa-access/*.test.mjs
  protected-scope:
    permissions:
      contents: read
      actions: read
    if: github.repository == 'poe2-build-navi-jp/gemnao' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prepare/feedback-preview-controller-20261007' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject repository or organization credential fallback
        env:
          QA_OUTSIDE_CF_PRESENT: ${{ secrets.GEMNAO_PREVIEW_CLOUDFLARE_API_TOKEN != '' }}
          QA_OUTSIDE_ACCESS_PRESENT: ${{ secrets.GEMNAO_QA_ACCESS_PASSPHRASE != '' }}
        run: |
          test "$QA_OUTSIDE_ACCESS_PRESENT" = "false"
          test "$QA_OUTSIDE_CF_PRESENT" = "false"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f53724eefe8aa60cc2522e12adbc97f821e6f122
          path: reviewed-controller
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify exact read-only diagnostic context and Environment
        if: inputs.mode == 'read-existing-qa-gate'
        env:
          QA_DIAGNOSTIC_MODE: ${{ inputs.mode }}
          PREVIEW_GITHUB_TOKEN: ${{ github.token }}
          QA_OUTSIDE_CF_PRESENT: ${{ secrets.GEMNAO_PREVIEW_CLOUDFLARE_API_TOKEN != '' }}
          QA_OUTSIDE_ACCESS_PRESENT: ${{ secrets.GEMNAO_QA_ACCESS_PASSPHRASE != '' }}
        run: node ops/worker-qa-access/read-existing-gate.mjs gate
  classify:
    if: inputs.mode == 'classify-secret-format'
    needs: protected-scope
    environment: gemnao-preview-data
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Classify format without revealing credential metadata
        env:
          GEMNAO_QA_ACCESS_PASSPHRASE: ${{ secrets.GEMNAO_QA_ACCESS_PASSPHRASE }}
        run: node ops/worker-qa-access/diagnose-secret.mjs
  read-existing-gate:
    permissions:
      contents: read
      actions: read
    needs: protected-scope
    if: inputs.mode == 'read-existing-qa-gate'
    environment: gemnao-preview-data
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f53724eefe8aa60cc2522e12adbc97f821e6f122
          path: reviewed-controller
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Read fixed existing gate after owner approval
        env:
          QA_DIAGNOSTIC_MODE: ${{ inputs.mode }}
          PREVIEW_GITHUB_TOKEN: ${{ github.token }}
          GEMNAO_PREVIEW_CLOUDFLARE_API_TOKEN: ${{ secrets.GEMNAO_PREVIEW_CLOUDFLARE_API_TOKEN }}
        run: node ops/worker-qa-access/read-existing-gate.mjs read
